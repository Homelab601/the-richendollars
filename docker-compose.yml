version: "3.9"

services:
  richendollars:
    container_name: richendollars
    build: .

    ports:
      - "5173:5173"
      - "3001:3001"

    volumes:
      - .:/app
      - /app/node_modules

    restart: unless-stopped

    environment:
      - CHOKIDAR_USEPOLLING=true
      - DOCKER_CONTAINER=true